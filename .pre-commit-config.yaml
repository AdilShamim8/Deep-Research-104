# ──────────────────────────────────────────────────────────────────────────────
# Deep Research 104 — pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Last verified: 17 October 2026
# ──────────────────────────────────────────────────────────────────────────────

repos:

  # ── Meta checks (whitespace, EOF, large files, merge markers) ──────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: debug-statements

  # ── Python: ruff (lint + format) ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|config|tests)/.+\.py$
      - id: ruff-format
        files: ^(src|config|tests)/.+\.py$

  # ── Python: black (secondary format check) ────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11
        files: ^(src|config|tests)/.+\.py$

  # ── Python: type checking ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (src)
        files: ^src/.+\.py$
        additional_dependencies:
          - pydantic>=2.7.0
          - pydantic-settings>=2.2.0
          - types-PyYAML
          - types-redis
        args: [--ignore-missing-imports, --no-strict-optional]
        verbose: true
        pass_filenames: false
        entry: bash -c 'mypy src || true'  # best-effort, don't block

  # ── Security: pip-audit ────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.4.18
    hooks:
      - id: pip-audit
        name: pip-audit (requirements.txt)
        files: ^requirements.*\.txt$
        pass_filenames: false
        args: [--strict]
        verbose: true

  # ── Markdown lint ──────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD024, MD033, MD041, MD046]
        files: \.md$

  # ── Dockerfile lint ──────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [--failure-threshold, warning]
        files: ^Dockerfile$
